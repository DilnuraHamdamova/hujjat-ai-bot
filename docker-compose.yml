services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    ports:
      - "8000:8000"
    volumes:
      - documents:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO
    volumes:
      - documents:/app/storage
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Expose only on the VM loopback; access from IntelliJ uses an SSH tunnel.
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: cvbot
      POSTGRES_USER: cvbot
      POSTGRES_PASSWORD: cvbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvbot -d cvbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  documents:
